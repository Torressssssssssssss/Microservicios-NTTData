      - name: excludeAllergen
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Allergen'
      - name: spice
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 5
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^(createdAt|name|spiceLevel),(asc|desc)$
          default: createdAt,desc
      - name: recent
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:

openapi: 3.0.3
info:
  title: TacoCloud course API
  version: 1.0.0
  description: 'TC-01 to TC-36. Money: MXN, sum of ingredient prices, HALF_UP at 2
    decimals. /api is a transitional alias with Deprecation: true and Link to this
    spec; no removal date is committed. Use /api/v1. Catalog metadata is academic
    and does not replace cross-contamination controls. Runtime Spring Boot 2.5 / MVC.'
servers:
- url: /api/v1
- url: /api
  description: Deprecated compatibility alias

components:
  schemas:
    IngredientType:
      type: string
      enum:
      - WRAP
      - PROTEIN
      - VEGGIES
      - CHEESE
      - SAUCE
    DietaryTag:
      type: string
      enum:
      - VEGAN
      - VEGETARIAN
      - GLUTEN_FREE
    Allergen:
      type: string
      enum:
      - GLUTEN
      - MILK
      - SOY
      - PEANUT
      - TREE_NUT
      - EGG
      - FISH
      - SHELLFISH
    Status:
      type: string
      enum:
      - CREATED
      - ACCEPTED
      - PREPARING
      - READY
      - OUT_FOR_DELIVERY
      - DELIVERED
      - CANCELLED
    IngredientRequest:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/IngredientType'
      additionalProperties: false
      required:
      - name
      - type
    IngredientResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/IngredientType'
        unitPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
        available:
          type: boolean
        dietaryTags:
          type: array
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/Allergen'
        spiceLevel:
          type: integer
          minimum: 0
          maximum: 5
      additionalProperties: false
      required:
      - id
      - name
      - type
      - unitPrice
      - available
      - dietaryTags
      - allergens
      - spiceLevel
    CatalogUpdate:
      type: object
      properties:
        unitPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
        available:
          type: boolean
        reorderLevel:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        dietaryTags:
          type: array
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/Allergen'
        spiceLevel:
          type: integer
          minimum: 0
          maximum: 5
      additionalProperties: false
      required:
      - unitPrice
      - version
    IngredientAdminResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/IngredientType'
        unitPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
        available:
          type: boolean
        dietaryTags:
          type: array
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/Allergen'
        spiceLevel:
          type: integer
          minimum: 0
          maximum: 5
        stockOnHand:
          type: integer
          minimum: 0
        reorderLevel:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - id
      - name
      - type
      - unitPrice
      - available
      - dietaryTags
      - allergens
      - spiceLevel
      - stockOnHand
      - reorderLevel
      - version
    StockAdjustment:
      type: object
      properties:
        delta:
          type: integer
          minimum: -1000000
          maximum: 1000000
      additionalProperties: false
      required:
      - delta
    DesignRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 5
          maxLength: 100
        ingredientIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 2
          maxItems: 12
        beverage:
          type: boolean
          default: false
        vegan:
          type: boolean
          default: false
      additionalProperties: false
      required:
      - name
      - ingredientIds
    TacoResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientResponse'
        beverage:
          type: boolean
        dietaryTags:
          type: array
          items:
            $ref: '#/components/schemas/DietaryTag'
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/Allergen'
        spiceLevel:
          type: integer
          minimum: 0
          maximum: 5
      additionalProperties: false
      required:
      - name
      - ingredients
      - beverage
      - dietaryTags
      - allergens
      - spiceLevel
    ItemRequest:
      type: object
      properties:
        taco:
          $ref: '#/components/schemas/DesignRequest'
        quantity:
          type: integer
          minimum: 1
          maximum: 50
      additionalProperties: false
      required:
      - taco
      - quantity
    OrderCreateRequest:
      type: object
      properties:
        deliveryName:
          type: string
          minLength: 1
          maxLength: 100
        deliveryStreet:
          type: string
          minLength: 1
          maxLength: 200
        deliveryCity:
          type: string
          minLength: 1
          maxLength: 100
        deliveryState:
          type: string
          minLength: 1
          maxLength: 100
        deliveryZip:
          type: string
          pattern: ^[A-Za-z0-9 -]{3,12}$
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRequest'
          minItems: 1
          maxItems: 50
        paymentMethodId:
          type: string
          minLength: 1
        couponCode:
          type: string
          maxLength: 40
          nullable: true
      additionalProperties: false
      required:
      - deliveryName
      - deliveryStreet
      - deliveryCity
      - deliveryState
      - deliveryZip
      - items
      - paymentMethodId
    OrderReplacement:
      type: object
      properties:
        deliveryName:
          type: string
          minLength: 1
          maxLength: 100
        deliveryStreet:
          type: string
          minLength: 1
          maxLength: 200
        deliveryCity:
          type: string
          minLength: 1
          maxLength: 100
        deliveryState:
          type: string
          minLength: 1
          maxLength: 100
        deliveryZip:
          type: string
          pattern: ^[A-Za-z0-9 -]{3,12}$
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRequest'
          minItems: 1
          maxItems: 50
        paymentMethodId:
          type: string
          minLength: 1
        couponCode:
          type: string
          maxLength: 40
          nullable: true
        id:
          type: string
          nullable: true
      additionalProperties: false
      required:
      - deliveryName
      - deliveryStreet
      - deliveryCity
      - deliveryState
      - deliveryZip
      - items
      - paymentMethodId
    OrderPatch:
      type: object
      properties:
        deliveryName:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        deliveryStreet:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        deliveryCity:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        deliveryState:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        deliveryZip:
          type: string
          pattern: ^[A-Za-z0-9 -]{3,12}$
          nullable: true
      additionalProperties: false
    OrderLine:
      type: object
      properties:
        taco:
          $ref: '#/components/schemas/TacoResponse'
        quantity:
          type: integer
          minimum: 1
        unitPriceAtPurchase:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
        subtotal:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
      additionalProperties: false
      required:
      - taco
      - quantity
      - unitPriceAtPurchase
      - subtotal
    OrderResponse:
      type: object
      properties:
        deliveryName:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        deliveryStreet:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        deliveryCity:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        deliveryState:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        deliveryZip:
          type: string
          pattern: ^[A-Za-z0-9 -]{3,12}$
          nullable: true
        id:
          type: string
          nullable: true
        placedAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/Status'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        subtotal:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
        discount:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
        total:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 7.0
        currency:
          type: string
          enum:
          - MXN
        version:
          type: integer
          nullable: true
        paymentBrand:
          type: string
          nullable: true
        paymentLast4:
          type: string
          pattern: ^[0-9]{4}$
          nullable: true
      additionalProperties: false
      required:
      - status
      - items
      - subtotal
      - discount
      - total
      - currency
    KitchenOrder:
      type: object
      properties:
        id:
          type: string
        placedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/Status'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        estimatedPrepMinutes:
          type: integer
          minimum: 0
        stationId:
          type: string
          nullable: true
        version:
          type: integer
      additionalProperties: false
      required:
      - id
      - status
      - items
      - estimatedPrepMinutes
      - version
    Transition:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      required:
      - status
      - version
      - reason
    ReorderRequest:
      type: object
      properties:
        paymentMethodId:
          type: string
          minLength: 1
        confirmPriceChange:
          type: boolean
          default: false
      additionalProperties: false
      required:
      - paymentMethodId
    Rating:
      type: object
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
      additionalProperties: false
      required:
      - score
    Ranking:
      type: object
      properties:
        _id:
          type: string
        average:
          type: number
          minimum: 1
          maximum: 5
        count:
          type: integer
          minimum: 1
        distribution:
          type: object
          properties:
            '1':
              type: integer
              minimum: 0
            '2':
              type: integer
              minimum: 0
            '3':
              type: integer
              minimum: 0
            '4':
              type: integer
              minimum: 0
            '5':
              type: integer
              minimum: 0
          additionalProperties: false
      additionalProperties: false
      required:
      - _id
      - average
      - count
      - distribution
    TokenizeRequest:
      type: object
      properties:
        syntheticCard:
          type: string
          pattern: ^test_[0-9]{4}$
          example: test_4242
      additionalProperties: false
      required:
      - syntheticCard
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
        brand:
          type: string
        last4:
          type: string
          pattern: ^[0-9]{4}$
      additionalProperties: false
      required:
      - id
      - brand
      - last4
    RegistrationRequest:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9_.-]{3,40}$
        password:
          type: string
          minLength: 10
          maxLength: 72
          writeOnly: true
        email:
          type: string
          format: email
        fullname:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        city:

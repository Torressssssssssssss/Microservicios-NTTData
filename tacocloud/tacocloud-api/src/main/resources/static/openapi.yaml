        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        description: Invalid or absent values are replaced by a UUID.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: name
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: ingredientId
        in: query
        required: false
        schema:
          type: string
